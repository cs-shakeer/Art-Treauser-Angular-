<div class="auth-container">
  <div class="auth-card glass">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 24px;">P</div>
      <h1 style="font-size: 32px; letter-spacing: -1px;">Welcome to Art Treasure</h1>
      <p style="color: var(--text-muted); margin-top: 8px;">Find new ideas to try</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label style="font-size: 14px; margin-bottom: 8px; display: block;">Email or Username</label>
        <input type="text" class="form-control" placeholder="Email or Username" [(ngModel)]="username" name="username" required />
      </div>
      <div class="form-group">
        <label style="font-size: 14px; margin-bottom: 8px; display: block;">Password</label>
        <input type="password" class="form-control" placeholder="Password" [(ngModel)]="password" name="password" required />
      </div>
      <div *ngIf="errorMessage" style="color: var(--primary-color); font-size: 14px; margin-bottom: 16px; text-align: center;">
        {{ errorMessage }}
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 24px; padding: 14px;">Log in</button>
      </div>
    </form>
    
    <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
      <p style="font-weight: 600; cursor: pointer;">Forgot your password?</p>
      <div style="margin-top: 16px;">
        Not on Art Treasure yet? <a routerLink="/register" style="color: var(--text-color); font-weight: 700;">Sign up</a>
      </div>
    </div>
  </div>
</div>
