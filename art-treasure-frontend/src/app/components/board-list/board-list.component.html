<div style="max-width: 1200px; margin: 0 auto; padding: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
    <h1>My Boards</h1>
    <button class="btn btn-primary" (click)="showCreateForm = !showCreateForm">
      {{ showCreateForm ? 'Cancel' : '+ Create Board' }}
    </button>
  </div>

  <div *ngIf="showCreateForm" class="glass" style="padding: 24px; border-radius: 16px; margin-bottom: 32px;">
    <form (ngSubmit)="onCreateBoard()">
      <div class="form-group">
        <label>Board Name</label>
        <input type="text" class="form-control" [(ngModel)]="newBoard.name" name="name" required />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" [(ngModel)]="newBoard.description" name="description"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Board</button>
    </form>
  </div>

  <div class="masonry-grid">
    <div class="masonry-item" *ngFor="let board of boards" style="background: var(--secondary-color); padding: 24px; display: block;">
      <h3 style="margin-bottom: 8px;">{{ board.name }}</h3>
      <p style="color: var(--text-muted); font-size: 14px;">{{ board.description }}</p>
    </div>
  </div>
</div>
