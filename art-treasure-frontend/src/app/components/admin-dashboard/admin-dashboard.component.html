<div class="admin-container">
  <h1 style="margin-bottom: 24px;">Admin Dashboard</h1>
  
  <div class="stats-grid">
    <div class="stat-card glass">
      <h3>Total Users</h3>
      <div class="stat-value">{{ users.length }}</div>
    </div>
    <div class="stat-card glass">
      <h3>Active Boards</h3>
      <div class="stat-value">124</div>
    </div>
    <div class="stat-card glass">
      <h3>Total Pins</h3>
      <div class="stat-value">892</div>
    </div>
  </div>

  <h2 style="margin: 32px 0 16px 0;">Manage Users</h2>
  <div class="table-responsive glass" style="border-radius: var(--border-radius-md); padding: 16px;">
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="border-bottom: 1px solid var(--text-muted); text-align: left;">
          <th style="padding: 12px;">ID</th>
          <th style="padding: 12px;">Name</th>
          <th style="padding: 12px;">Email</th>
          <th style="padding: 12px;">Professional</th>
          <th style="padding: 12px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" style="border-bottom: 1px solid var(--glass-border);">
          <td style="padding: 12px;">{{ user.userId }}</td>
          <td style="padding: 12px;">{{ user.fullName }}</td>
          <td style="padding: 12px;">{{ user.email }}</td>
          <td style="padding: 12px;">
            <span [style.color]="user.isProfessional ? 'green' : 'var(--text-muted)'">
              {{ user.isProfessional ? 'Yes' : 'No' }}
            </span>
          </td>
          <td style="padding: 12px;">
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px; margin-right: 8px;">Edit</button>
            <button class="btn btn-primary" style="padding: 4px 8px; font-size: 12px; background-color: #d32f2f;">Delete</button>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="5" style="padding: 24px; text-align: center; color: var(--text-muted);">No users found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
