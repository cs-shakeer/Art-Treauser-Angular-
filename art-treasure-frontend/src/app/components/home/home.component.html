<div class="masonry-grid">
  <!-- Mock Pins -->
  <div class="masonry-item" *ngFor="let pin of pins" [routerLink]="['/pin', pin.id]">
    <img [src]="pin.imageUrl" alt="Pin Image" />
    <div class="overlay">
      <div style="align-self: flex-end;">
        <button class="btn btn-primary" style="padding: 8px 12px; font-size: 14px;">Save</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; color: white;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-weight: 700; font-size: 14px;">{{ pin.title }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
