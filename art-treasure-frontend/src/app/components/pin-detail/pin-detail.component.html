<div class="pin-detail-container" *ngIf="pin">
  <button class="btn btn-secondary back-btn" (click)="goBack()">← Back</button>
  
  <div class="pin-card glass">
    <div class="pin-image">
      <img [src]="pin.imageUrl" [alt]="pin.title" />
    </div>
    
    <div class="pin-info">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="display: flex; gap: 16px;">
          <button class="btn btn-secondary" style="border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">🔗</button>
          <button class="btn btn-secondary" style="border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">⬇</button>
        </div>
        <button class="btn btn-primary" style="padding: 12px 24px;">Save</button>
      </div>

      <h1 style="font-size: 32px; margin-bottom: 16px;">{{ pin.title }}</h1>
      <p style="margin-bottom: 24px;">{{ pin.description || 'No description provided.' }}</p>

      <div class="creator-info" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="avatar" style="width: 48px; height: 48px; font-size: 20px;">U</div>
          <div>
            <div style="font-weight: 700;">{{ pin.user?.fullName || 'Creator Name' }}</div>
            <div style="color: var(--text-muted); font-size: 14px;">1.2k followers</div>
          </div>
        </div>
        <button class="btn btn-secondary">Follow</button>
      </div>

      <div>
        <h3 style="font-size: 20px; margin-bottom: 16px;">Comments</h3>
        <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">No comments yet! Add one to start the conversation.</p>
        
        <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--glass-border); display: flex; gap: 12px; margin-top: 40px;">
          <div class="avatar" style="width: 48px; height: 48px; font-size: 20px;">Me</div>
          <input type="text" class="form-control" placeholder="Add a comment" style="border-radius: 24px;" />
        </div>
      </div>
    </div>
  </div>
</div>
