      <div class="logo">P</div>
      <span style="font-weight: 700; color: var(--primary-color);">Art Treasure</span>
    </a>
  </div>
  <div class="navbar-search">
    <input type="text" class="form-control" placeholder="Search for ideas..." />
  </div>
  <div class="navbar-actions">
